    <line x1="7" y1="12" x2="2" y2="12" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="7" y1="16" x2="2" y2="16" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="7" y1="20" x2="2" y2="20" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="25" y1="12" x2="30" y2="12" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="25" y1="16" x2="30" y2="16" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="25" y1="20" x2="30" y2="20" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round"/>
  </g>

