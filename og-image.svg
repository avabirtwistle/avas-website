<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#080809"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a20" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c87941" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c87941" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.35"/>
  <circle cx="900" cy="180" r="220" fill="url(#glow)"/>
  <circle cx="220" cy="500" r="180" fill="url(#glow)" fill-opacity="0.6"/>

  <g transform="translate(120 165) scale(4.5)">
    <rect width="32" height="32" rx="7" fill="#141418"/>
    <rect x="7" y="7" width="18" height="18" rx="3" fill="#c87941"/>
